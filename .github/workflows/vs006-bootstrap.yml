name: VS006 Bootstrap

on:
  push:
    branches:
      - mvp/combat-loop

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Apply exact local patch
        run: |
          base64 -d .github/vs006.patch.xz.b64 | xz -d > /tmp/vs006.patch
          git apply --check /tmp/vs006.patch
          git apply --index /tmp/vs006.patch
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Full quality gate
        run: pnpm check
      - name: Verify and publish exact tree
        run: |
          git rm .github/vs006.patch.xz.b64 .github/workflows/vs006-bootstrap.yml
          ACTUAL_TREE="$(git write-tree)"
          EXPECTED_TREE="77aa5bd028ab89962886c3dec4ecda26a3df2497"
          echo "actual=$ACTUAL_TREE expected=$EXPECTED_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add near-MVP checks and basic combat loop"
          git push origin HEAD:mvp/combat-loop
