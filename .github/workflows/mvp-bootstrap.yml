name: MVP Bootstrap

on:
  push:
    branches:
      - mvp/playable-loop

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Apply exact local patch
        shell: bash
        run: |
          cat > /tmp/mvp-patch.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/mvp-patch.b64 | gunzip > /tmp/mvp.patch
          git apply --index /tmp/mvp.patch
          rm .github/workflows/mvp-bootstrap.yml
          git add -A
          tree=$(git write-tree)
          echo "tree=$tree"
          test "$tree" = "cbcf5058ac2b74d674840959a106161b161d482f"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Full quality gate
        run: pnpm check
      - name: Commit exact verified tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add playable character and initiative loop"
          git push origin HEAD:mvp/playable-loop
