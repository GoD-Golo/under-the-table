name: Landing Bootstrap
on:
  push:
    branches: [design/landing-brand]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Reassemble exact local patch
        run: |
          cat .github/landingpart00 .github/landingpart01 .github/landingpart02 .github/landingpart03 .github/landingpart04 > /tmp/landing.payload.b64
          echo '8989dec5a4109e35d3c1b2f5bed295f64d29c5d5b2ddf5f0a0eaf313bd37647c  /tmp/landing.payload.b64' | sha256sum -c -
          base64 -d /tmp/landing.payload.b64 | xz -d > /tmp/landing.patch
          git apply --check /tmp/landing.patch
          git apply --index /tmp/landing.patch
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Full quality gate
        run: pnpm check
      - name: Verify and publish exact tree
        run: |
          git rm -f .github/workflows/landing-bootstrap.yml .github/landingpart00 .github/landingpart01 .github/landingpart02 .github/landingpart03 .github/landingpart04
          git diff --cached --check
          TREE=$(git write-tree)
          echo "result tree=$TREE"
          test "$TREE" = 'e7a51c56a7c34a82c2e491661356c1a6891678ad'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Under The Table landing identity'
          git push origin HEAD:design/landing-brand
