name: apply simple fog placeholder

on:
  push:
    branches:
      - play/simple-fog-placeholder

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact local patch
        run: |
          git apply --check .github/fog-placeholder.patch
          git apply .github/fog-placeholder.patch
          rm .github/fog-placeholder.patch
          rm .github/workflows/apply-fog-placeholder.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify project
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm check

      - name: Verify exact tree and publish
        run: |
          git add -A
          TREE="$(git write-tree)"
          test "$TREE" = "373ca6be24ad6f34395cf771d3ec944ed7079fed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add simple fog reveal placeholder"
          git push
