name: Bootstrap verified lockfile

on:
  push:
    branches:
      - foundation/vertical-slice-003

permissions:
  contents: write

jobs:
  verify-and-commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Generate exact lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify lockfile identity
        run: |
          actual="$(git hash-object pnpm-lock.yaml)"
          expected="f61f938a30c25169b8e6651df9f1faaa15fce0d8"
          echo "lockfile blob: $actual"
          test "$actual" = "$expected"
      - name: Verify project from frozen lockfile
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bootstrap-lock.yml
          git add pnpm-lock.yaml .github/workflows/bootstrap-lock.yml
          git commit -m "chore: add verified pnpm lockfile"
          git push origin HEAD:foundation/vertical-slice-003
