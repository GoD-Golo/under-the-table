name: apply VS004 character foundation

on:
  push:
    branches:
      - character/foundation

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact local patch
        run: |
          base64 -d .github/vs004.patch.xz.b64 | xz -d > /tmp/vs004.patch
          git apply --check /tmp/vs004.patch
          git apply /tmp/vs004.patch
          rm .github/vs004.patch.xz.b64
          rm .github/workflows/apply-vs004-character-foundation.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify project
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm check

      - name: Verify exact tree and publish
        run: |
          git add -A
          TREE="$(git write-tree)"
          test "$TREE" = "b858019dee9e79e5ba715e1a5211c3028e213e55"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: establish character foundation"
          git push
