name: VS008 Bootstrap

on:
  push:
    branches:
      - mvp/character-lifecycle-vs008

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/vs008part00 .github/vs008part01 .github/vs008part02 .github/vs008part03 .github/vs008part04 .github/vs008part05 .github/vs008part06 .github/vs008part07 .github/vs008part08 > .github/vs008.patch.xz.b64
          echo "3f7913b6a6e82ac09d2e0379630cec572c42135481a36810817cd714f90c93a9  .github/vs008.patch.xz.b64" | sha256sum -c -
          base64 -d .github/vs008.patch.xz.b64 > .github/vs008.patch.xz
          xz -dc .github/vs008.patch.xz > .github/vs008.patch
          git apply --index .github/vs008.patch
          rm -f .github/vs008.patch .github/vs008.patch.xz .github/vs008.patch.xz.b64
          git rm -f .github/workflows/vs008-bootstrap.yml .github/vs008part00 .github/vs008part01 .github/vs008part02 .github/vs008part03 .github/vs008part04 .github/vs008part05 .github/vs008part06 .github/vs008part07 .github/vs008part08
      - name: Verify workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
      - name: Verify exact tested tree and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "d213b88452aa67acff83919c7e7b9353d4120afa"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "VS008 — Character campaign lifecycle"
          test "$(git rev-parse HEAD^{tree})" = "d213b88452aa67acff83919c7e7b9353d4120afa"
          git push origin HEAD:mvp/character-lifecycle-vs008
